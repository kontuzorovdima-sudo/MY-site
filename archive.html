<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DKVA | АРХИВ</title>
    <link rel="stylesheet" href="cs.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <canvas id="matrix-bg"></canvas>
    <div class="crt-overlay"></div>
    <div class="vignette"></div>

    <div class="ui-wrapper">
        <header>
            <nav>
                <a href="index.html" class="nav-link">← НАЗАД</a>
            </nav>
        </header>

        <main class="archive-container">
            <div class="terminal-box archive-main">
                <div class="terminal-header">
                    <div class="header-left">
                        <div class="status-dot"></div>
                        <span class="system-path">МОДУЛЬ:/ВОССТАНОВЛЕНИЕ/ЖУРНАЛ_ИСТОРИИ/</span>
                    </div>
                    <div class="header-right" id="system-time">00:00:00</div>
                </div>

                <div id="history-container" class="archive-history"></div>

                <div class="archive-footer">
                    <span class="blink-cursor">></span>
                    <span class="footer-hint">ВЫБЕРИТЕ_ЗАПИСЬ_ДЛЯ_ВОССТАНОВЛЕНИЯ</span>
                </div>
            </div>
        </main>

        <footer>
            <div class="status-bar">
                <span>АРХИВ: 01</span>
                <span>©2025 DKVA</span>
            </div>
        </footer>
    </div>

    <script src="matrix.js"></script>
    <script src="void.js"></script>
    <script src="ARCHIVE.js"></script>
</body>
</html>
