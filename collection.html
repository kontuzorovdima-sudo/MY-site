<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>DKVA | КОЛЛЕКЦИИ</title>
    <link rel="stylesheet" href="cs.v5.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <canvas id="matrix-bg"></canvas>
    <div class="crt-overlay"></div>
    <div class="vignette"></div>

    <div class="ui-wrapper">
        <header>
            <nav>
                <a href="index.html" class="nav-link">← НАЗАД</a>
                <span class="nav-link">КОЛЛЕКЦИИ</span>
                <a href="cart.html" class="nav-link">КОРЗИНА</a>
                <a href="auth.html" class="nav-link" id="authLink">ВОЙТИ</a>
            </nav>
        </header>

        <section class="collections">
            <div class="item" data-name="ХУДИ ПУСТОТЫ" data-img="img/dfdfdffdddddddddd.png" data-price="4500">
                <img src="img/dfdfdffdddddddddd.png" alt="">
                <span class="item-title">ХУДИ ПУСТОТЫ</span>
                <span class="item-price">4 500 ₽</span>
                <p class="item-desc">Тяжёлый хлопковый худи с вышивкой.</p>
                <div class="size-selector">
                    <span class="size-label">РАЗМЕР:</span>
                    <button class="size-btn active" data-size="S">S</button>
                    <button class="size-btn" data-size="M">M</button>
                    <button class="size-btn" data-size="L">L</button>
                    <button class="size-btn" data-size="XL">XL</button>
                </div>
                <button class="add-cart-btn">+ В КОРЗИНУ</button>
            </div>

            <div class="item" data-name="КРОВАВАЯ ФУТБОЛКА" data-img="img/safddasdasdas.png" data-price="2500">
                <img src="img/safddasdasdas.png" alt="">
                <span class="item-title">ФУТБОЛКА</span>
                <span class="item-price">2 500 ₽</span>
                <p class="item-desc">Оверсайз футболка из органического хлопка с вышивкой.</p>
                <div class="size-selector">
                    <span class="size-label">РАЗМЕР:</span>
                    <button class="size-btn active" data-size="S">S</button>
                    <button class="size-btn" data-size="M">M</button>
                    <button class="size-btn" data-size="L">L</button>
                    <button class="size-btn" data-size="XL">XL</button>
                </div>
                <button class="add-cart-btn">+ В КОРЗИНУ</button>
            </div>

            <div class="item" data-name="АРХИВНЫЕ БРЮКИ" data-img="img/dadsadasdsadsasad.png" data-price="5000">
                <img src="img/dadsadasdsadsasad.png" alt="">
                <span class="item-title">БРЮКИ</span>
                <span class="item-price">5 000 ₽</span>
                <p class="item-desc">Свободные брюки из плотной ткани с вышивкой. Уникальный узор.</p>
                <div class="size-selector">
                    <span class="size-label">РАЗМЕР:</span>
                    <button class="size-btn active" data-size="S">S</button>
                    <button class="size-btn" data-size="M">M</button>
                    <button class="size-btn" data-size="L">L</button>
                    <button class="size-btn" data-size="XL">XL</button>
                </div>
                <button class="add-cart-btn">+ В КОРЗИНУ</button>
            </div>
        </section>

        <footer>
            <div class="status-bar">
                <span>КОЛЛЕКЦИЯ: 01</span>
                <span>©2025 DKVA</span>
            </div>
        </footer>
    </div>

    <script src="matrix.js"></script>
    <script src="void.js"></script>
    <script src="auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            document.querySelectorAll('.add-cart-btn').forEach(btn => {
                btn.onclick = () => {
                    const item = btn.closest('.item');
                    const name = item.dataset.name;
                    const size = item.querySelector('.size-btn.active').dataset.size;
                    const price = parseInt(item.dataset.price) || 0;
                    const cart = JSON.parse(localStorage.getItem('dkvaCart') || '[]');
                    cart.push({ name, size, price });
                    localStorage.setItem('dkvaCart', JSON.stringify(cart));
                    btn.textContent = '✓ ДОБАВЛЕНО';
                    setTimeout(() => { btn.textContent = '+ В КОРЗИНУ'; }, 1000);
                };
            });

            document.querySelectorAll('.size-selector').forEach(selector => {
                selector.addEventListener('click', (e) => {
                    if (e.target.classList.contains('size-btn')) {
                        selector.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
                        e.target.classList.add('active');
                    }
                });
            });
        });
    </script>
</body>
</html>
